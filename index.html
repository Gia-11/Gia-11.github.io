<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teamable</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js"></script>
</head>

<body>
    <div id="display-view">
        <h1>User Profile</h1>
        <img src="profile.jpeg">

        <span>Name: </span><b>Anna Smith</b>
        <hr /> <!-- html for line on screen -->

        <span>Email: </span><b>anna.smith@example.com</b>
        <hr /> <!-- html for line on screen -->

        <span>Interests: </span><b>Coding</b>
        <hr /> <!-- html for line on screen -->

        <button onclick="handleEditProfile()">Edit Profile</button>
    </div>


    <div id="edit-view">
        <h1>User Profile</h1>
        <img src="profile.jpeg">
        <span>Name: </span>
        <input type="text" placeholder="Your Name" />
        <hr /> <!-- html for line on screen -->
        <span>Email: </span>
        <input type="text" placeholder="email@example.com" />
        <hr /> <!-- html for line on screen -->
        <span>Interests: </span>
        <input type="text" placeholder="scripting" />
        <hr /> <!-- html for line on screen -->
        <button onclick="handleUpdateProfile()">Edit Profile</button>
    </div>

</body>

</html>
